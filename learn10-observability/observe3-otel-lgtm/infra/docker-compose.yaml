name: observe3-otel-lgtm

services:
  lgtm:
    # one container: OTel Collector + Prometheus + Tempo + Loki + Grafana
    image: grafana/otel-lgtm:1.3
    container_name: observe3-lgtm
    ports:
      - "3000:3000" # Grafana (admin / admin)
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP, used by the services
      - "9090:9090" # Prometheus API, handy for curl checks
    volumes:
      - ./grafana/spring-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/spring-dashboards.yaml:ro
      - ./grafana/spring-services.json:/otel-lgtm/spring-services.json:ro
