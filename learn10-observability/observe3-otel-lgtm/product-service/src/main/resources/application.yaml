spring:
  application:
    name: product-service

server:
  port: 8112

management:
  tracing:
    sampling:
      probability: 1.0
    baggage:
      remote-fields: customer-id
      tag-fields: customer-id
      correlation:
        fields: customer-id
  opentelemetry:
    resource-attributes:
      deployment.environment: local
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        step: 10s
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-},%X{customer-id:-}] "
