spring:
  application:
    name: order-service # becomes the OTel service.name

server:
  port: 8111

product:
  base-url: http://localhost:8112

management:
  tracing:
    sampling:
      probability: 1.0 # keep every trace while learning
    baggage:
      remote-fields: customer-id # propagated to product-service as a header
      tag-fields: customer-id # also added as a span attribute
      correlation:
        fields: customer-id # copied into the logging MDC
  opentelemetry:
    resource-attributes:
      deployment.environment: local
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        step: 10s # push often so the dashboard moves while you test
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-},%X{customer-id:-}] "
