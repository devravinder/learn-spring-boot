name: observe4-otel-javaagent

services:
  lgtm:
    # same all-in-one backend as observe3; run only one of the two at a time
    image: grafana/otel-lgtm:1.3
    container_name: observe4-lgtm
    ports:
      - "3000:3000" # Grafana (admin / admin)
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP, the agent default
      - "9090:9090" # Prometheus API
    volumes:
      - ./grafana/spring-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/spring-dashboards.yaml:ro
      - ./grafana/spring-agent.json:/otel-lgtm/spring-agent.json:ro
