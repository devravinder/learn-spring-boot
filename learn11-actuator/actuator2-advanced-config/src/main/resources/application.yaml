spring:
  application:
    name: actuator2-advanced-config

server:
  port: 8102

app:
  payment:
    api-token: tok_local_dev_only # masked by the custom SanitizingFunction

info:
  app:
    team: platform
    description: Actuator configuration playground

management:
  server:
    port: 9102 # actuator on its own port, kept off the public load balancer
  endpoints:
    access:
      default: read-only # only read operations unless an endpoint opts in below
    web:
      base-path: /manage
      exposure:
        include: "*"
        exclude: heapdump # large and full of secrets
      cors:
        allowed-origins: http://localhost:3000
        allowed-methods: GET
  endpoint:
    health:
      show-details: when-authorized
      roles: ACTUATOR
      probes:
        enabled: true
        add-additional-paths: true # /livez and /readyz on the main port for Kubernetes
      group:
        readiness:
          include: readinessState,paymentGateway
    loggers:
      access: unrestricted
    features:
      access: unrestricted
    shutdown:
      access: unrestricted
    env:
      show-values: when-authorized
      roles: ACTUATOR
    configprops:
      show-values: when-authorized
      roles: ACTUATOR
    beans:
      cache:
        time-to-live: 10s
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    process:
      enabled: true
  httpexchanges:
    recording:
      include: request-headers,response-headers,time-taken,principal

logging:
  level:
    com.paravar.ops: INFO
