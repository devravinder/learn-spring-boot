name: learn-mfa

services:
  mailhog:
    # catches every email locally; nothing is delivered to the internet
    image: mailhog/mailhog:latest
    container_name: mfa-mailhog
    ports:
      - "1025:1025" # SMTP for the apps
      - "8025:8025" # web inbox + JSON API

  keycloak:
    # identity provider for mfa5; the realm is imported at start, no persistence
    image: keycloak/keycloak:latest
    container_name: mfa-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080" # login pages + OIDC endpoints
      - "9180:9000" # health
    volumes:
      - ./keycloak/learn-realm.json:/opt/keycloak/data/import/learn-realm.json:ro
